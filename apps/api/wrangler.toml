name = "profjero-sms-api"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Explicit defaults so future changes are deliberate.
workers_dev = true
preview_urls = true

[vars]
ENVIRONMENT = "development"

[env.staging]
name = "profjero-sms-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "profjero-sms-api-prod"

[env.production.vars]
ENVIRONMENT = "production"